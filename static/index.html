<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku Helper</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Installable on Android, which is also what makes the app show up in the
       share sheet: a share target is registered with the OS at install time. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1565c0" />
  <link rel="icon" href="/static/icons/icon-192.png" />
</head>
<body>
  <main>
    <h1>Puzzle Helper</h1>
    <!-- Everything below the title is rendered by web/app.tsx: the tab bar and
         one panel per puzzle type. There is deliberately no markup here for
         them — a tab's markup lives with the code that drives it. -->
    <div id="app"></div>
  </main>
  <!-- Built from web/app.tsx by Vite; see vite.config.ts. Module scripts are
       deferred, so DOMContentLoaded still fires after this has loaded. -->
  <script type="module" src="/static/dist/app.js"></script>
</body>
</html>
