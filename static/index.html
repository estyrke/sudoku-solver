<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku Helper</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>Sudoku Helper</h1>
    <p class="sub">Paste or drop a screenshot, fix any misreads, then get the simplest next step.</p>

    <div id="drop" class="drop">
      <strong>Drop / paste a screenshot here</strong>, or
      <label class="link">choose a file<input id="file" type="file" accept="image/*" hidden /></label>.
      <div id="dropStatus" class="status"></div>
    </div>

    <div class="layout">
      <div class="board-wrap">
        <div id="board" class="board" tabindex="0"></div>
        <div class="modes">
          <button id="modePen" class="mode active" data-mode="pen">Pen</button>
          <button id="modePencil" class="mode" data-mode="pencil">Pencil</button>
          <span class="hintkeys">click a cell, type 1–9 · 0/⌫ clears</span>
        </div>
        <div class="actions">
          <button id="getHint" class="primary">Get hint</button>
          <button id="apply" disabled>Apply step</button>
          <button id="confirmRead" disabled title="Teach the reader from your corrections">Confirm reading</button>
          <button id="clear">Clear</button>
        </div>
      </div>

      <aside class="panel">
        <h2>Hint</h2>
        <div id="hint" class="hint empty">No hint yet.</div>
        <div id="reveal" class="reveal" hidden>
          <button data-level="1">Nudge</button>
          <button data-level="2">Technique</button>
          <button data-level="3">Full</button>
        </div>
      </aside>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
