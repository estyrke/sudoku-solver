[pytest]
# The packages under test live at the repo root and are imported by name
# (`from sudoku.model import ...`), but nothing installs them, and pytest puts
# only the test file's own directory on sys.path. `python -m pytest` happens to
# paper over that by adding the working directory; bare `pytest` does not.
# Setting it here makes both spellings work the same way.
pythonpath = .
testpaths = tests
