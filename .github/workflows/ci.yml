name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run of the same branch irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Model, techniques, solver, audit and the CV reader. The reader's digit
  # exemplars are baked into sudoku/reader/glyph_seeds.npz rather than rendered
  # at import, precisely so this job agrees with a developer's macOS run —
  # cv2.putText anti-aliases differently across platforms.
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # The browser modules: typechecked, built, then driven headlessly through
  # jsdom. Separate from the Python job because "the engine is wrong" and "the
  # page never showed what the engine said" are different failures and should
  # read differently.
  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # static/dist is committed because the deploy has no Node step: what is in
      # the repo is what gets served. A build that changes it means the sources
      # moved on without it.
      - name: The committed bundle matches the sources
        # --porcelain as well as diff: a build that emits a file name nobody has
        # committed yet is untracked, and `git diff` would not see it.
        run: |
          git diff --exit-code -- static/dist
          test -z "$(git status --porcelain -- static/dist)"
      - run: npm ci
        working-directory: tests/ui
      - run: node --test
        working-directory: tests/ui
