name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run of the same branch irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, because there is one language left: the app is static files and
  # every engine, both readers and the share dispatcher run in the browser. The
  # Python job that used to sit beside this one went with the runtime it tested.
  #
  # What that job's separation was for is kept as separate steps instead. "The
  # engine is wrong", "the reader misread the screenshot" and "the page never
  # showed what the engine said" are different failures, and a run that fails
  # should say which one it was without anyone opening the log.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/ui/package-lock.json
            tests/components/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

      # Pure-logic unit tests for the ported engines in web/sudoku/ and
      # web/queens/ (Board, the technique catalogues, findHint, solve, the
      # mistake audit), run straight off the .ts source with Node's own
      # type-stripping rather than through Vite — see tests/engine/package.json.
      - name: Engine
        run: npm test
        working-directory: tests/engine

      # The committed OpenCV.js artifact and its loader. Cheap to run and the
      # only thing standing between a bad regeneration of static/vendor/opencv/
      # and a reader that cannot start.
      - name: OpenCV artifact
        run: npm test
        working-directory: tests/cv

      # The screenshot reader, held cell-for-cell to the boards committed
      # beside the fixture screenshots. This is where "ported at parity" is
      # actually checked, and it runs against the same WASM the browser loads.
      - name: Reader
        run: npm test
        working-directory: tests/reader

      # The step where a shared screenshot's reading becomes a tab. Neither
      # neighbour can hold it — jsdom never reaches it, and the reader suite
      # ends before tabs exist — so it runs on its own.
      - name: Share handoff
        run: npm test
        working-directory: tests/share

      # The shared widgets in web/ui/ on their own, under Vitest — they are
      # .tsx, which Node's type-stripping cannot compile.
      - name: Install (components)
        run: npm ci
        working-directory: tests/components
      - name: Components
        run: npm test
        working-directory: tests/components

      # dist/ is not committed — the deploy runs this same command
      # (vercel.json) — so this step is both the check that the sources still
      # build and the only way the page suite below has a site to load.
      - name: Build the site
        run: npm run build

      # The page under jsdom, driven with real events. Needs the build above:
      # it loads dist/, the site as deployed, rather than the sources.
      - name: Install (page)
        run: npm ci
        working-directory: tests/ui
      - name: Page
        run: npm test
        working-directory: tests/ui

      # The shell the page is installed inside: sw.js run outside a browser in
      # a vm sandbox, and the arrangement that puts it and the manifest at the
      # site root. Last because it is the cheapest, and its own step because
      # a broken worker and a page that discards what the engine said are
      # different failures — which is the distinction the deleted Python job
      # used to draw, kept as a group rather than as a job.
      - name: Service worker and hosting
        run: npm test
        working-directory: tests/shell
